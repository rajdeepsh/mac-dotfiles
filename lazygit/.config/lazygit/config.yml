gui:
  nerdFontsVersion: "3"
  theme:
    activeBorderColor:
      - "#ff9e64"
      - "bold"
    inactiveBorderColor:
      - "#27a1b9"
    searchingActiveBorderColor:
      - "#ff9e64"
      - "bold"
    optionsTextColor:
      - "#7aa2f7"
    selectedLineBgColor:
      - "#283457"
    cherryPickedCommitFgColor:
      - "#7aa2f7"
    cherryPickedCommitBgColor:
      - "#bb9af7"
    markedBaseCommitFgColor:
      - "#7aa2f7"
    markedBaseCommitBgColor:
      - "#e0af68"
    unstagedChangesColor:
      - "#db4b4b"
    defaultFgColor:
      - "#c0caf5"
customCommands:
  - key: 'v'
    context: 'files'
    description: 'Smart commit'
    command: "git diff --staged --quiet || (MSG=$(git diff --staged | opencode run -c --agent plan 'Generate a concise git commit message for this staged diff. Output ONLY the raw commit message with no markdown, no code blocks, no backticks, no colons, no explanations.') && git commit -m \"$MSG\" && git push && osascript -e 'display notification \"Changes committed & pushed\" with title \"LazyGit\" sound name \"Blow\"')"
    loadingText: 'Smart committing...'
    output: log
git:
  diffRenderers:
    - command: delta --dark --paging=never
